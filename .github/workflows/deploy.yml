name: Build and Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
      - ai-trainer-portfolio-website-a602a
  pull_request:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # This is a Cloudflare PAGES project (pages_build_output_dir is set
          # in wrangler.toml), so we must use `pages deploy`, not `deploy`.
          command: pages deploy dist --project-name=xbraan1-portfolio --branch=${{ github.ref_name }}
